<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Protein Hunter</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-WSGNGLPF');</script>
    <!-- End Google Tag Manager -->

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/2.6.2/phaser.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="images/rainbow.png" alt="" class="splash-rainbow" aria-hidden="true">
        <div class="splash-content">
            <img src="images/logo-amadori.png" alt="Amadori" class="splash-logo">
            
            <img src="images/protein-hunter.png" alt="Protein Hunter" class="splash-title-img">
            
            <div class="splash-info-box">
                <p class="splash-subtitle">
                    Non vedi l’ora di giocare?<br>
                    Inganna l’attesa… giocando!
                </p>

                <p class="splash-description">
                    Dai la caccia alle proteine e catturale tutte passandoci il dito sopra...<br>
                    Ma presta attenzione ai trabocchetti esplosivi!
                </p>
            </div>
            
            <div class="splash-buttons">
                <button id="start-button">GIOCA ORA!</button>
                <a href="leaderboard.html" class="splash-leaderboard-btn">Vedi classifica</a>
            </div>
        </div>
    </div>

    <div id="game"></div>
    <div id="score-container" class="hidden">
        <span id="score-value">0</span>
    </div>
    <div id="timer-container" class="hidden">
        <span id="timer-value">1:00</span>
    </div>
    <div id="lives-container" class="hidden">
        <img src="images/heart.png" alt="" class="life-heart" data-life="1">
        <img src="images/heart.png" alt="" class="life-heart" data-life="2">
        <img src="images/heart.png" alt="" class="life-heart" data-life="3">
    </div>
    <div id="combo-popup" class="combo-popup hidden"></div>

    <!-- Game Over Popup -->
    <div id="game-over-popup" class="game-over-popup hidden">
        <div class="game-over-popup-box">
            <div class="game-over-header">
                <h2 class="game-over-title">Punteggio finale</h2>
                <p class="game-over-score" id="game-over-score-value">0</p>
            </div>

            <!-- Step 1: inserisci nickname -->
            <div id="game-over-step-nickname" class="game-over-step">
                <div class="game-over-form">
                    <label class="game-over-label" for="game-over-nickname">Inserisci Nickname</label>
                    <input type="text" id="game-over-nickname" class="game-over-input" placeholder="Inserisci nickname" maxlength="20">
                </div>
                <button type="button" id="game-over-save-btn" class="game-over-btn game-over-btn-primary">Salva punteggio</button>
            </div>

            <!-- Step 2: azioni post-salvataggio -->
            <div id="game-over-step-actions" class="game-over-step hidden">
                <p id="game-over-saved-msg" class="game-over-saved-msg"></p>
                <div class="game-over-buttons">
                    <button type="button" id="game-over-leaderboard-btn" class="game-over-btn game-over-btn-outline">Vedi la classifica</button>
                    <button type="button" id="game-over-play-again-btn" class="game-over-btn game-over-btn-primary">Gioca ancora</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaderboard Popup -->
    <div id="leaderboard-popup" class="leaderboard-popup hidden">
        <div class="leaderboard-popup-box">
            <h2 class="leaderboard-title">Classifica</h2>
            <ol id="leaderboard-list" class="leaderboard-list"></ol>
            <p id="leaderboard-empty" class="leaderboard-empty hidden">Nessun punteggio salvato.</p>
            <button type="button" id="leaderboard-close-btn" class="game-over-btn game-over-btn-primary">Chiudi</button>
        </div>
    </div>

    <img src="images/decorative-stripes.png" alt="" class="game-stripes">

    <!-- Game Modules -->
    <script src="js/config.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/game-objects.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
