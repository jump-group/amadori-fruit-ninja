<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Classifica - Protein Hunter</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="lb-page">
        <div class="lb-page-content">
            <img src="images/logo-amadori.png" alt="Amadori" class="lb-page-logo">
            <h1 class="lb-page-title">Classifica</h1>

            <div class="lb-page-card">
                <ol id="lb-page-list" class="leaderboard-list"></ol>
                <p id="lb-page-empty" class="leaderboard-empty">Nessun punteggio salvato.</p>
            </div>

            <a href="index.html" class="lb-page-back-btn">Torna al gioco</a>
        </div>

        <img src="images/decorative-stripes.png" alt="" class="splash-stripes">
    </div>

    <script src="js/leaderboard.js"></script>
    <script>
        (function() {
            Leaderboard.load();
            var entries = Leaderboard.getEntries();
            var list = document.getElementById('lb-page-list');
            var empty = document.getElementById('lb-page-empty');

            if (entries.length === 0) {
                empty.style.display = '';
                list.style.display = 'none';
            } else {
                empty.style.display = 'none';
                entries.forEach(function(entry) {
                    var li = document.createElement('li');
                    var nick = document.createElement('span');
                    nick.className = 'lb-nickname';
                    nick.textContent = entry.nickname;
                    var sc = document.createElement('span');
                    sc.className = 'lb-score';
                    sc.textContent = entry.score;
                    li.appendChild(nick);
                    li.appendChild(sc);
                    list.appendChild(li);
                });
            }
        })();
    </script>
</body>

</html>
