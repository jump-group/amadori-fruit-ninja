<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Reset Classifica - Protein Hunter</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <style>
        .reset-btn {
            display: inline-block;
            background-color: #E53935;
            color: #FFFFFF;
            border: none;
            font-family: 'Barlow', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            padding: clamp(0.7rem, 1.2vw, 1rem) clamp(2rem, 4vw, 3rem);
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: clamp(0.5rem, 1vw, 1rem);
            flex-shrink: 0;
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(229, 57, 53, 0.4);
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        .reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .confirm-overlay.visible {
            display: flex;
        }

        .confirm-box {
            background: #FFFFFF;
            border-radius: 24px;
            padding: clamp(1.5rem, 3vw, 2.5rem) clamp(1.5rem, 3vw, 3rem);
            max-width: 420px;
            width: 90vw;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .confirm-box p {
            font-family: 'Barlow', sans-serif;
            font-weight: 600;
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #022D1A;
            margin: 0;
        }

        .confirm-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .confirm-yes {
            background-color: #E53935;
            color: #FFFFFF;
            border: none;
            font-family: 'Barlow', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            padding: 0.7rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .confirm-yes:hover { transform: scale(1.05); }
        .confirm-yes:active { transform: scale(0.98); }

        .confirm-no {
            background-color: #005832;
            color: #FFFFFF;
            border: none;
            font-family: 'Barlow', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            padding: 0.7rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .confirm-no:hover { transform: scale(1.05); }
        .confirm-no:active { transform: scale(0.98); }

        .success-msg {
            display: none;
            font-family: 'Barlow', sans-serif;
            font-weight: 700;
            font-size: clamp(0.9rem, 1.8vw, 1.1rem);
            color: #FFFFFF;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 0.6rem 1.2rem;
            margin-bottom: clamp(0.5rem, 1vw, 1rem);
        }

        .success-msg.visible {
            display: block;
        }
    </style>
</head>

<body>
    <div class="lb-page">
        <div class="lb-page-content">
            <img src="images/logo-amadori.png" alt="Amadori" class="lb-page-logo">
            <h1 class="lb-page-title">Reset Classifica</h1>

            <div class="lb-page-card">
                <ol id="lb-page-list" class="leaderboard-list"></ol>
                <p id="lb-page-empty" class="leaderboard-empty">Nessun punteggio salvato.</p>
            </div>

            <p id="success-msg" class="success-msg">Classifica svuotata con successo!</p>
            <button id="reset-btn" class="reset-btn">Svuota classifica</button>
            <a href="leaderboard.html" class="lb-page-back-btn">Vedi classifica</a>
        </div>

        <img src="images/decorative-stripes.png" alt="" class="splash-stripes">
    </div>

    <div id="confirm-overlay" class="confirm-overlay">
        <div class="confirm-box">
            <p>Sei sicuro di voler eliminare tutti i punteggi?<br>Questa azione non può essere annullata.</p>
            <div class="confirm-actions">
                <button id="confirm-yes" class="confirm-yes">Sì, svuota</button>
                <button id="confirm-no" class="confirm-no">Annulla</button>
            </div>
        </div>
    </div>

    <script src="js/leaderboard.js"></script>
    <script>
        (function() {
            var list = document.getElementById('lb-page-list');
            var empty = document.getElementById('lb-page-empty');
            var resetBtn = document.getElementById('reset-btn');
            var confirmOverlay = document.getElementById('confirm-overlay');
            var confirmYes = document.getElementById('confirm-yes');
            var confirmNo = document.getElementById('confirm-no');
            var successMsg = document.getElementById('success-msg');

            function renderEntries() {
                Leaderboard.load();
                var entries = Leaderboard.getEntries();
                list.innerHTML = '';

                if (entries.length === 0) {
                    empty.style.display = '';
                    list.style.display = 'none';
                    resetBtn.disabled = true;
                } else {
                    empty.style.display = 'none';
                    list.style.display = '';
                    resetBtn.disabled = false;
                    entries.forEach(function(entry) {
                        var li = document.createElement('li');
                        var nick = document.createElement('span');
                        nick.className = 'lb-nickname';
                        nick.textContent = entry.nickname;
                        var sc = document.createElement('span');
                        sc.className = 'lb-score';
                        sc.textContent = entry.score;
                        li.appendChild(nick);
                        li.appendChild(sc);
                        list.appendChild(li);
                    });
                }
            }

            renderEntries();

            resetBtn.addEventListener('click', function() {
                confirmOverlay.classList.add('visible');
            });

            confirmNo.addEventListener('click', function() {
                confirmOverlay.classList.remove('visible');
            });

            confirmYes.addEventListener('click', function() {
                confirmOverlay.classList.remove('visible');
                Leaderboard.reset();
                renderEntries();
                successMsg.classList.add('visible');
                setTimeout(function() {
                    successMsg.classList.remove('visible');
                }, 3000);
            });

            confirmOverlay.addEventListener('click', function(e) {
                if (e.target === confirmOverlay) {
                    confirmOverlay.classList.remove('visible');
                }
            });
        })();
    </script>
</body>

</html>
